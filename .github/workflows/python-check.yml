name: Python syntax check
on:
  push:
    branches:
      - main
      - codex/complete-render-rewrite
  pull_request:
    branches:
      - main
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python sources
        run: python -m compileall -q .
