services:
  - type: web
    name: queen-2
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip wheel && pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: PORT
        value: "10000"
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: SESSION_NAME
        sync: false
      - key: BOT_NAME
        value: Queen Music
      - key: BOT_USERNAME
        sync: false
      - key: OWNER_USERNAME
        sync: false
      - key: SUPPORT_GROUP
        sync: false
      - key: CHANNEL_UPDATES
        sync: false
      - key: DURATION_LIMIT
        value: "90"
      - key: SUDO_USERS
        sync: false
      - key: COMMAND_PREFIXES
        value: "/"
