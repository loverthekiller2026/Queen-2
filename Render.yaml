services:
  - type: web
    name: AlexaMusic
    env: python
    plan: free
    buildCommand: pip3 install -U -r requirements.txt
    startCommand: python3 main.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: SESSION_NAME
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: OWNER_USERNAME
        sync: false
      - key: SUPPORT_GROUP
        sync: false
      - key: CHANNEL_UPDATES
        sync: false
      - key: DURATION_LIMIT
        sync: false
      - key: SUDO_USERS
        sync: false
      - key: PYTHON_VERSION
        value: 3.9.7
      - key: PORT
        value: "10000"
